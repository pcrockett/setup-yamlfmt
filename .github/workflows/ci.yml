# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pcrockett/setup-shfmt@bf26c86e340dc10783e5c105cf09a459a6b45751  # v0.1.2
      - uses: pcrockett/setup-just@619b6d5085fb33c9d06961086752efae1023ac77  # v0.1.3
      - uses: pcrockett/setup-pre-commit@90e294bdac0418fdec979074854d3019f76f59ea  # v0.1.3

      - name: Setup yamlfmt
        uses: ./

      - run: just lint
      - run: yamlfmt --version
